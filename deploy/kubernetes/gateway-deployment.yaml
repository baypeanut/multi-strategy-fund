apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: fund-llm
  labels:
    app.kubernetes.io/part-of: fund-llm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fund-llm
        app.kubernetes.io/name: model-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: gateway
        image: fund-llm-gateway:REPLACE_WITH_IMMUTABLE_IMAGE
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
        envFrom:
        - configMapRef:
            name: fund-llm-config
        env:
        - name: MODEL_BACKEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: fund-llm-secrets
              key: vllm-api-key
        - name: MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: fund-llm-secrets
              key: gateway-api-key
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          timeoutSeconds: 3
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      enableServiceLinks: false
